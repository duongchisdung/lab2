

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Chương trình thử riêng cảm biến DHT11 (chọn env này ở thanh dưới VS Code rồi Upload)
[env:dht_test]
extends = env:esp32dev
build_src_filter = -<*> +<../test_dht/dht_test.cpp>